version: '3.8'

services:
  app:
    build: .
    container_name: staybooker
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DB_HOST=mysql-ad17e30-db-render.l.aivencloud.com
      - DB_PORT=19173
      - DB_USER=avnadmin
      - DB_PASS=YOUR_AIVEN_PASSWORD
      - DB_NAME=defaultdb
      - DB_SYNCHRONIZE=true
      - DB_LOGGING=false
      - PORT=3000
      - JWT_SECRET=your_super_secret_jwt_key_change_this_in_production
      - JWT_EXPIRES_IN=1d
      - MAIL_HOST=smtp.gmail.com
      - MAIL_USER=your_email@gmail.com
      - MAIL_PASSWORD=your_app_password
      - MAIL_FROM=noreply@hotelbooking.com
    restart: unless-stopped
    networks:
      - staybooker-network

networks:
  staybooker-network:
    driver: bridge
